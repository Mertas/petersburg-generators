<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ГОРОД — House Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #0f0f14;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e4e4ec;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      cursor: grab;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .ui-header {
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      background: rgba(15, 15, 20, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 28px;
      pointer-events: auto;
    }

    .ui-header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #e4e4ec;
    }

    .ui-hints {
      bottom: 24px;
      left: 24px;
      font-size: 11px;
      color: #8888a0;
      background: rgba(15, 15, 20, 0.6);
      backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 20px;
      display: flex;
      gap: 14px;
      pointer-events: none;
      user-select: none;
    }

    .ui-hints kbd {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="ui-overlay ui-header">
    <h1>ГОРОДЪ</h1>
  </div>

  <div class="ui-overlay ui-hints">
    <span>Перетаскивание — панорама</span>
    <span>Колёсико — зум</span>
    <span><kbd>R</kbd> Сброс</span>
    <span>10×10 домов</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
